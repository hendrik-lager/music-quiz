services:
  music-quiz:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./playlists:/app/playlists:ro
    restart: unless-stopped
    networks:
      - traefik_web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.music-quiz.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.music-quiz.entrypoints=https"
      - "traefik.http.services.music-quiz.loadbalancer.server.port=3000"

networks:
  traefik_web:
    external: true
