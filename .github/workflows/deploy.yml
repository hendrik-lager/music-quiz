name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files to deploy path
        run: |
          rsync -a --delete \
            --exclude='.env' \
            --exclude='data/' \
            ${{ github.workspace }}/ /data/music-quiz/

      - name: Rebuild and restart container
        run: docker compose -f /data/music-quiz/docker-compose.yml up -d --build
